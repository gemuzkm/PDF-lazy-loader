name: Build assets

# Rebuilds assets/js/pdf-lazy-loader.min.js with terser whenever the source file
# changes and commits the result back to main. A push made with GITHUB_TOKEN
# does not start other workflows, so there is no loop.

on:
  push:
    branches: [main]
    paths:
      - "assets/js/pdf-lazy-loader.js"
      - ".github/workflows/build-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-assets

jobs:
  build:
    name: Minify JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Minify with terser
        run: |
          set -e
          npx --yes terser@5 assets/js/pdf-lazy-loader.js -c -m --comments false \
            -o assets/js/pdf-lazy-loader.min.js
          test -s assets/js/pdf-lazy-loader.min.js
          node --check assets/js/pdf-lazy-loader.min.js
          ls -l assets/js/pdf-lazy-loader.js assets/js/pdf-lazy-loader.min.js

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pdf-lazy-loader.min.js
          if git diff --cached --quiet; then
            echo "pdf-lazy-loader.min.js is already up to date"
          else
            git commit -m "build: rebuild pdf-lazy-loader.min.js"
            git push
          fi
