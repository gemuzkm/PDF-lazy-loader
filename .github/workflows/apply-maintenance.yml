name: Apply localization and cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-maintenance.yml'
      - '.github/scripts/apply-maintenance.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-maintenance
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Localize and prepare catalogs
        run: python3 .github/scripts/apply-maintenance.py
      - name: Validate and build
        run: |
          set -e
          php -l pdf-lazy-loader.php
          node --check assets/js/admin.js
          node --check assets/js/pdf-lazy-loader.js
          npx --yes terser@5 assets/js/pdf-lazy-loader.js -c -m --comments false -o assets/js/pdf-lazy-loader.min.js
          node --check assets/js/pdf-lazy-loader.min.js
          test -s languages/pdf-lazy-loader-ru_RU.mo
          test -s languages/pdf-lazy-loader.pot
      - name: Remove temporary files and commit
        run: |
          set -e
          git rm --ignore-unmatch .github/scripts/apply-asset-retry.py .github/scripts/apply-blob-download.py .github/scripts/apply-maintenance.py .github/workflows/apply-maintenance.yml
          git add pdf-lazy-loader.php assets/js/admin.js assets/js/pdf-lazy-loader.js assets/js/pdf-lazy-loader.min.js README.md languages/pdf-lazy-loader.pot languages/pdf-lazy-loader-ru_RU.po languages/pdf-lazy-loader-ru_RU.mo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: v1.3.8 — settings localization, compatibility notes and cleanup'
          git push origin HEAD:main
